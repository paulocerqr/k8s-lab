[defaults]
inventory = inventory.ini
remote_user = lab
# os nós são acessados pelo Tailscale SSH (K20): o host key é confirmado na 1ª conexão
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
forks = 10
# mostra quanto tempo cada tarefa levou (útil no teste de recriação)
callbacks_enabled = ansible.posix.profile_tasks

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
