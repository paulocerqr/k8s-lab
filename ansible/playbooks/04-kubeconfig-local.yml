# Passo 3 do docs/03-kubeadm.md: kubeconfig no PC de administração, apontando para a tailnet.
- name: Kubeconfig no PC de administração
  hosts: control_plane
  gather_facts: false

  tasks:
    - name: Ler a identidade do nó na tailnet
      ansible.builtin.command: tailscale status --self --json
      register: tailscale_status
      changed_when: false
      check_mode: false

    - name: Copiar o admin.conf do control plane
      ansible.builtin.slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_conf
      no_log: true

    - name: Diretório ~/.kube no PC
      ansible.builtin.file:
        path: "{{ kubeconfig_local | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    # O admin.conf aponta para o IP da VPC, que o PC não alcança; trocamos pelo nome na tailnet
    - name: Gravar {{ kubeconfig_local }} (credencial de administrador, permissão 600)
      ansible.builtin.copy:
        dest: "{{ kubeconfig_local }}"
        content: >-
          {{ admin_conf.content | b64decode
             | regex_replace('server: https://[^\n]+:6443',
                             'server: https://' ~ ((tailscale_status.stdout | from_json).Self.DNSName | regex_replace('\.$', '')) ~ ':6443') }}
        mode: "0600"
      delegate_to: localhost
      become: false
      no_log: true
