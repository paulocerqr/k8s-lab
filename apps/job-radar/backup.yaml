# Backup diário do Postgres (docs/12-backup.md): pg_dump → bucket do GCS.
# Sem chave guardada no cluster: o token vem do servidor de metadados da VM (conta dos
# nós, que só pode CRIAR objetos no bucket). O nome do bucket também vem dos metadados
# (<projeto>-k8s-lab-backup), para o ID do projeto não ficar no Git.
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: backup-postgres
spec:
  schedule: "0 3 * * *"                # 03:00, fora da janela de coleta
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: {app: backup}
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            # 1. dump no formato custom (comprimido, restaurável por tabela) e conferência
            - name: dump
              image: postgres:16-alpine
              securityContext:
                runAsUser: 70              # usuário "postgres" da imagem alpine
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              env:
                - {name: PGHOST, value: postgres}
                - {name: PGUSER, value: jobradar}
                - {name: PGDATABASE, value: jobradar}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: job-radar, key: POSTGRES_PASSWORD}
              command: ["sh", "-ec"]
              args:
                - |
                  pg_dump -Fc -f /backup/jobradar.dump
                  # um dump truncado falha aqui, antes de ir para o bucket
                  tabelas=$(pg_restore -l /backup/jobradar.dump | grep -c "TABLE DATA")
                  echo "dump: $(wc -c < /backup/jobradar.dump) bytes, $tabelas tabelas com dados"
              volumeMounts:
                - {name: backup, mountPath: /backup}
                - {name: tmp, mountPath: /tmp}
          containers:
            # 2. envio para o GCS pela API JSON, com o token da VM
            - name: enviar
              image: curlimages/curl:8.16.0
              securityContext:
                runAsUser: 101             # curl_user da imagem
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              command: ["sh", "-ec"]
              args:
                - |
                  md=http://169.254.169.254/computeMetadata/v1
                  token=$(curl -sf -H "Metadata-Flavor: Google" $md/instance/service-accounts/default/token \
                    | sed -E 's/.*"access_token":"([^"]+)".*/\1/')
                  projeto=$(curl -sf -H "Metadata-Flavor: Google" $md/project/project-id)
                  nome="jobradar-$(date -u +%Y%m%dT%H%M%SZ).dump"
                  tamanho=$(wc -c < /backup/jobradar.dump)
                  curl -sf -X POST --data-binary @/backup/jobradar.dump \
                    -H "Authorization: Bearer $token" -H "Content-Type: application/octet-stream" \
                    "https://storage.googleapis.com/upload/storage/v1/b/$projeto-k8s-lab-backup/o?uploadType=media&name=$nome" \
                    -o /tmp/resposta.json
                  # o GCS devolve o tamanho gravado: confere com o arquivo local
                  grep -q "\"size\": *\"$tamanho\"" /tmp/resposta.json
                  echo "enviado: $nome ($tamanho bytes)"
              volumeMounts:
                - {name: backup, mountPath: /backup, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: backup, emptyDir: {sizeLimit: 1Gi}}
            - {name: tmp, emptyDir: {sizeLimit: 16Mi}}
