# Configuração não sensível (a sensível está no SealedSecret "job-radar")
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: job-radar
data:
  TZ: America/Sao_Paulo
  LOG_FORMAT: json
  LOG_LEVEL: INFO
  COLETA_NO_WORKER: "false"      # no cluster, a coleta é feita pelos CronJobs (D17, K10)
  WORKER_HEARTBEAT_PATH: /tmp/job-radar-worker.heartbeat
  SESSAO_COOKIE_SEGURO: "true"   # Web UI só por HTTPS (Cloudflare); a chave da sessão vem da FERNET_KEY
