# Job Radar no lab (plano §5.3). A versão da imagem fica SÓ aqui:
#   kubectl apply -k apps/job-radar   (o Job de migração é aplicado pelo playbook 11)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: job-radar
labels:
  - pairs:
      app.kubernetes.io/part-of: job-radar
    includeSelectors: false
resources:
  - namespace.yaml
  - sealedsecret.yaml
  - configmap.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - cronjobs.yaml
  - backup.yaml
  - networkpolicy.yaml
images:
  - name: ghcr.io/paulocerqr/job-radar
    newTag: ef9379124a7e24e96f85b60b5b7a8440b437f0a0   # commit da main publicado pelo CI
