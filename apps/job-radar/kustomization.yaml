# Job Radar no lab (plano §5.3). A versão da imagem fica SÓ aqui (newTag).
# Aplicado pelo Argo CD (argocd/apps/job-radar.yaml): mudou no Git, o cluster acompanha.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: job-radar
labels:
  - pairs:
      app.kubernetes.io/part-of: job-radar
    includeSelectors: false
resources:
  - namespace.yaml
  - sealedsecret.yaml
  - configmap.yaml
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - cronjobs.yaml
  - backup.yaml
  - migrar-job.yaml   # hook do Argo CD (onda 0)
  - networkpolicy.yaml
images:
  - name: ghcr.io/paulocerqr/job-radar
    newTag: ef9379124a7e24e96f85b60b5b7a8440b437f0a0   # commit da main publicado pelo CI
