# Migrations + seed antes de cada versão nova (RNF11), como hook do Argo CD
# (docs/13-argocd.md): recriado a cada sincronização, na onda 0 — depois do Postgres
# (onda -1) e antes de API, worker e CronJobs (onda 1). A imagem vem do `newTag` do
# kustomization, como a dos outros pods. Migrations e seed são idempotentes.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrar
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation   # apaga o anterior antes de criar
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: migrar}
    spec:
      restartPolicy: Never
      # sem variáveis automáticas dos Services: o Service "api" geraria
      # API_PORT=tcp://..., que colide com a configuração API_PORT do app
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrar
          image: ghcr.io/paulocerqr/job-radar
          args: ["migrar"]
          envFrom:
            - configMapRef: {name: job-radar}
            - secretRef: {name: job-radar}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      containers:
        - name: seed
          image: ghcr.io/paulocerqr/job-radar
          args: ["seed"]
          envFrom:
            - configMapRef: {name: job-radar}
            - secretRef: {name: job-radar}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
