# Postgres do lab (dados próprios do lab, nunca da produção: K13).
# Volume num disco persistente da GCP (pd-balanced, docs/11-discos-gerenciados.md): num
# drain ou queda de nó, o disco é desanexado e o pod renasce em outro worker.
# O nome do volume mudou de "dados" (local-path) para "dados-pd" na migração de 24/10/2026:
# o template de volume de um StatefulSet não pode ser alterado, e com o mesmo nome o
# StatefulSet novo reaproveitaria o PVC antigo.
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: jobradar
            - name: POSTGRES_DB
              value: jobradar
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: job-radar, key: POSTGRES_PASSWORD}
            - name: PGDATA                 # subpasta: o volume tem um lost+found na raiz
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "jobradar", "-d", "jobradar"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "jobradar", "-d", "jobradar"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}   # medido: 61 Mi, CPU p95 13m (docs/14-recursos.md)
            limits: {memory: 512Mi}               # folga: o cache do banco cresce com os dados
          volumeMounts:
            - name: dados-pd
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: dados-pd
      spec:
        storageClassName: pd-balanced
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi              # mínimo do pd-balanced
