# Postgres do lab (dados próprios do lab, nunca da produção: K13).
# Volume no disco do nó (local-path): o pod fica preso ao nó onde o volume nasceu.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: jobradar
            - name: POSTGRES_DB
              value: jobradar
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: job-radar, key: POSTGRES_PASSWORD}
            - name: PGDATA                 # subpasta: o volume tem um lost+found na raiz
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "jobradar", "-d", "jobradar"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "jobradar", "-d", "jobradar"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        storageClassName: local-path
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
