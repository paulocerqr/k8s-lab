# Segredos do Job Radar no lab, cifrados com o Sealed Secrets do cluster.
# Cópia em texto puro só em ~/.config/k8s-lab/job-radar.env (fora do Git).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: job-radar
  namespace: job-radar
spec:
  encryptedData:
    ADMIN_EMAIL: 
    ADMIN_SENHA: 
    DATABASE_URL: 
    FERNET_KEY: 
    GEMINI_API_KEY: 
    GROQ_API_KEY: 
    NVIDIA_API_KEY: 
    POSTGRES_PASSWORD: 
    TELEGRAM_BOT_TOKEN: 
  template:
    metadata:
      name: job-radar
      namespace: job-radar
    type: Opaque
