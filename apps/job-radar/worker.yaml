# Worker: alimentador, auditor, expirador, notificações e polling do Telegram.
# Sempre 1 réplica e Recreate (D16): dois schedulers duplicariam jobs, e só um
# processo pode fazer polling do bot do Telegram.
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 60   # termina o lote de auditoria em andamento (RNF12)
      # sem variáveis automáticas dos Services: o Service "api" geraria
      # API_PORT=tcp://..., que colide com a configuração API_PORT do app
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/paulocerqr/job-radar
          args: ["worker"]
          envFrom:
            - configMapRef: {name: job-radar}
            - secretRef: {name: job-radar}
          livenessProbe:                  # heartbeat gravado pelo scheduler a cada 30 s
            # em shell, sem subir o Python: o `job-radar worker-saude` levava ~2 s de CPU
            # por execução e deixava ~80 KB de cache do kernel (dentries) contados na
            # memória do container a cada minuto, ~115 Mi/dia (docs/14-recursos.md)
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y "$WORKER_HEARTBEAT_PATH" 2>/dev/null || echo 0) )) -le 120
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}   # medido: ~75 Mi típico, 136 Mi máx (docs/14-recursos.md)
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
