# Argo CD (chart argo/argo-cd 10.11.1, v3.5.6) — docs/13-argocd.md
# Tudo no cp-1, como o monitoramento (K10): os workers ficam para as aplicações.
global:
  nodeSelector:
    kubernetes.io/hostname: cp-1
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

configs:
  params:
    # interface só por port-forward (nada exposto); sem TLS no próprio servidor
    server.insecure: true
  cm:
    # o Git é público: o Argo CD lê sem credencial. Checa mudanças a cada 3 min.
    timeout.reconciliation: 180s

# sem login por SSO (só o admin local) e sem notificações
dex:
  enabled: false
notifications:
  enabled: false
# ApplicationSet não é usado: as apps são arquivos em argocd/apps (app-of-apps)
applicationSet:
  replicas: 0

# Requests/limites a partir do uso medido (docs/14-recursos.md); sem request, o pod é
# BestEffort e o primeiro a ser despejado se o nó ficar sem memória.
controller:
  resources:
    requests: {cpu: 100m, memory: 512Mi}   # medido: 439 Mi, CPU p95 64m
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {cpu: 25m, memory: 64Mi}     # medido: 41 Mi
    limits: {memory: 256Mi}
server:
  resources:
    requests: {cpu: 25m, memory: 64Mi}     # medido: 51 Mi
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 32Mi}     # medido: 10 Mi
    limits: {memory: 128Mi}
