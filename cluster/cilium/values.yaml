# Cilium (CNI) — chart cilium/cilium 1.20.3
# helm upgrade --install cilium cilium/cilium --version 1.20.3 -n kube-system -f cluster/cilium/values.yaml

# IPs dos pods: cada nó recebe um pedaço (/24) do podSubnet do kubeadm (10.244.0.0/16),
# atribuído pelo controller-manager. O padrão do Cilium ("cluster-pool" em 10.0.0.0/8)
# colidiria com a VPC do lab (10.10.0.0/24).
ipam:
  mode: kubernetes

# Pacotes entre pods de nós diferentes vão encapsulados (VXLAN) por cima da rede da VPC.
# Não exige rotas na GCP; o firewall "lab-interno" já libera o tráfego entre os nós.
routingMode: tunnel
tunnelProtocol: vxlan

# O Cilium faz o papel do kube-proxy (Services em eBPF, sem iptables). Exigido pela
# Gateway API do Cilium (K23). Sem kube-proxy, o próprio Cilium precisa achar o
# API server: k8sServiceHost é passado pelo Ansible (IP do cp-1 na VPC).
kubeProxyReplacement: true
k8sServicePort: 6443

# Só a interface da VPC. Sem isso o Cilium também usa a tailscale0: portas NodePort
# passam a responder pelo IP da tailnet e os dois disputam marcas de pacote (fwmark).
devices: ens4

# A Gateway API do Cilium ficou desligada: o Envoy dele não alcança backends no
# mesmo nó (issue cilium/cilium#47940, docs/incidentes/002). A entrada é o Traefik.
gatewayAPI:
  enabled: false

rollOutCiliumPods: true
envoy:
  rollOutPods: true

operator:
  replicas: 1
  rollOutPods: true

# Hubble: visibilidade do tráfego entre pods (fluxos, drops, políticas)
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
