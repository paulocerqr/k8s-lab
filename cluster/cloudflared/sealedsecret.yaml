# Token do túnel "k8s-lab", cifrado com a chave do Sealed Secrets do cluster.
# Só o controlador do cluster abre. Para trocar: ver docs/07-cloudflare-tunnel.md
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: tunnel-token
  namespace: cloudflared
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: tunnel-token
      namespace: cloudflared
