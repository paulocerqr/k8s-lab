# Usuário/senha de administrador do Grafana, cifrados com o Sealed Secrets do cluster.
# A senha em texto puro fica só em ~/.config/k8s-lab/grafana-admin-senha (fora do Git).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  encryptedData:
    admin-password: 
    admin-user: 
  template:
    metadata:
      name: grafana-admin
      namespace: monitoring
