# App de teste da entrada: https://teste-lab.utileasy.com.br
# Mostra o pod que respondeu (útil para ver o balanceamento entre os nós).
#   kubectl apply -f cluster/teste/whoami.yaml   |   kubectl delete -f cluster/teste/whoami.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: teste
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: teste
spec:
  replicas: 2
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: whoami}
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: teste
spec:
  selector: {app: whoami}
  ports: [{port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whoami
  namespace: teste
spec:
  parentRefs: [{name: lab, namespace: traefik}]
  hostnames: ["teste-lab.utileasy.com.br"]
  rules:
    - backendRefs: [{name: whoami, port: 80}]
